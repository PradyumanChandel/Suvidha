<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Suvidha Admin</title>
<style>
:root{--bg:#FBFBFD;--soft:#F5F5F7;--line:#E4E4E9;--ink:#1D1D1F;--mute:#6E6E73;--teal:#0A6C74;--teal-d:#07474D;--tint:#EDF7F7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--teal);color:#fff;border:0;border-radius:980px;padding:9px 18px;cursor:pointer;font-weight:500}.btn:hover{background:var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--line)}.btn.bad{background:#B3261E}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#lf{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.06)}
h1{font-size:24px;letter-spacing:-.03em}.msg{font-size:13px;min-height:18px;color:#B3261E}.ok{color:#2F7D5B}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;flex-wrap:wrap;gap:10px}
nav{display:flex;gap:8px;flex-wrap:wrap}
main{padding:24px 5%;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar select,.bar input{width:auto;flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block;overflow-x:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--soft);font-size:12px;color:var(--mute)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--tint)}
.pill{display:inline-block;padding:2px 10px;border-radius:980px;background:var(--tint);color:var(--teal);font-size:12px;font-weight:600}.pill.c{background:#FDECEA;color:#B3261E}.pill.d{background:#E7F5EC;color:#2F7D5B}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;position:sticky;top:80px}
.panel dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}.panel dt{color:var(--mute)}.panel dd{overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}ul{list-style:none;display:grid;gap:4px;font-size:13px;color:var(--mute)}
@media(max-width:900px){main{grid-template-columns:1fr}.panel{position:static}}
</style></head>
<body>
<div id="login"><form id="lf"><h1>Suvidha admin</h1><input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required><button class="btn" type="submit">Sign in</button><p class="msg" id="lmsg" role="status"></p></form></div>
<div id="app" hidden>
<header><b>Suvidha Admin</b><nav><button class="btn alt" data-tab="tb">Bookings</button><button class="btn alt" data-tab="tp">Partners</button><button class="btn alt" id="out">Sign out</button></nav></header>
<main id="tb"><section><div class="bar"><select id="fs"><option value="">All statuses</option><option>REQUESTED</option><option>CONFIRMED</option><option>ASSIGNED</option><option>ON_THE_WAY</option><option>COMPLETED</option><option>CANCELLED</option></select><input id="fq" placeholder="Search reference, name or phone"></div><table><thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>When</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section><aside class="panel" id="detail"><p>Select a booking to see details.</p></aside></main>
<main id="tp" hidden style="grid-template-columns:1fr"><section><table><thead><tr><th>Name</th><th>Phone</th><th>Skill</th><th>Experience</th><th>Area</th><th>Status</th></tr></thead><tbody id="prow"></tbody></table></section></main>
</div>
<script src="/admin.js"></script>
</body></html>
